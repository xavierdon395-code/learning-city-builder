<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>学习城市建设者 — 统计</title>
    <style>
      html,
      body {
        background: #050507;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/weekly-report-modal.css" />
    <link rel="stylesheet" href="../css/dev-panel.css" />
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/font-noto-sans-sc.js"></script>
    <script src="../js/pdf-export.js"></script>
  
    <link rel="prefetch" href="index.html" />
    <link rel="prefetch" href="goals.html" />
    <link rel="prefetch" href="city.html" />
    <link rel="prefetch" href="stats.html" />
  </head>
  <body class="stats-page app-body--nav-56">
    <canvas id="cosmos-bg" class="cosmos-bg" aria-hidden="true"></canvas>
    <header class="app-top-bar">
      <div class="app-top-bar__left">
        <div class="app-top-bar__logo">
          <div class="app-top-bar__logo-dot"></div>
        </div>
        <span class="app-top-bar__brand">Lumi</span>
      </div>
      <div class="app-top-bar__right">
        <div class="app-top-bar__moon-pill">
          <div class="app-top-bar__moon-dot"></div>
          <span id="topbar-zodiac">金牛月</span>
        </div>
        <div class="app-top-bar__avatar" id="topbar-avatar" onclick="logout()" title="点击退出">
          <span id="topbar-avatar-initial">U</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="card">
        <h2 class="card__title">个人档案</h2>
        <p class="muted" style="margin-top: 0">完善简介可解锁成就「完善档案」（建议不少于 8 个字）。</p>
        <div class="form-field">
          <label for="st-profile-bio">个人简介</label>
          <textarea id="st-profile-bio" rows="3" placeholder="简单介绍一下你的学习方向与阶段…"></textarea>
        </div>
        <button type="button" class="btn btn--primary" id="st-save-bio">保存简介</button>
      </section>

      <section class="card">
        <div class="stats-card-head">
          <h1 class="card__title">学习统计</h1>
          <button type="button" id="btn-export-pdf" class="pdf-export-btn">导出 PDF</button>
        </div>
        <div class="stat-grid" id="st-stat-grid">
          <div class="stat-box stat-box--icon">
            <span class="stat-box__ico" aria-hidden="true"
              ><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg
            ></span>
            <div>
              总学习天数<br /><strong id="st-total-days">0</strong>
              <div class="muted" style="margin-top: 4px; font-size: 0.72rem">有打卡的不同日期数</div>
            </div>
          </div>
          <div class="stat-box stat-box--icon">
            <span class="stat-box__ico" aria-hidden="true"
              ><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg
            ></span>
            <div>
              总完成任务<br /><strong id="st-total-tasks">0</strong>
            </div>
          </div>
          <div class="stat-box stat-box--icon">
            <span class="stat-box__ico" aria-hidden="true"
              ><svg viewBox="0 0 24 24"
                ><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2" /></svg
            ></span>
            <div>
              当前连续打卡<br /><strong id="st-cur-streak">0</strong> 天
            </div>
          </div>
          <div class="stat-box stat-box--icon">
            <span class="stat-box__ico" aria-hidden="true"
              ><svg viewBox="0 0 24 24"
                ><path d="M8 21h8M12 17v4M6 3h12v4a6 6 0 0012 0V5a1 1 0 00-1-1h-3M6 3H3a1 1 0 00-1 1v2a6 6 0 006 6" /></svg
            ></span>
            <div>
              最长连续打卡<br /><strong id="st-long-streak">0</strong> 天
            </div>
          </div>
        </div>
      </section>

      <section class="card card--weekly-report" id="st-weekly-report" aria-busy="false">
        <h2 class="card__title">AI 周复盘</h2>
        <p class="muted weekly-report__meta" id="st-weekly-meta">—</p>
        <div id="st-weekly-loading" class="weekly-report__loading muted" hidden>正在生成，请稍候…</div>
        <div id="st-weekly-error" class="weekly-report__error" role="alert" hidden></div>
        <div id="st-weekly-body" class="weekly-report__body"></div>
        <div class="weekly-report__actions">
          <button type="button" class="btn btn--secondary btn--small" id="st-weekly-generate">生成本周复盘</button>
          <button type="button" class="btn btn--secondary btn--small" id="st-weekly-regenerate" disabled>
            重新生成
          </button>
        </div>
      </section>
      <section id="wr-history-section" class="wr-history"></section>

      <section class="card">
        <h2 class="card__title">成就星图 · 十二星座</h2>
        <p class="muted" style="margin-top: 0">每解锁 1 项成就点亮 1 颗星，踏遍十二星座，绘制属于你的星辰图谱</p>
        <div id="st-streak-orbit" class="streak-orbit"></div>
        <div class="zodiac-pager">
          <button type="button" class="btn btn--secondary btn--small" id="st-zodiac-prev">上一座</button>
          <button type="button" class="btn btn--secondary btn--small" id="st-zodiac-next">下一座</button>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">各目标完成率</h2>
        <div id="st-goals"></div>
      </section>

      <section class="card">
        <h2 class="card__title">最近 7 天完成数</h2>
        <div class="bar-chart" id="st-bar-chart" role="img" aria-label="最近7天柱状图"></div>
      </section>

      <section class="card">
        <h2 class="card__title">任务类型占比</h2>
        <div id="st-type-bar" class="type-stack" aria-label="类型占比"></div>
        <div class="pie-legend" id="st-type-legend"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html" data-nav="home">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5.5 9.5V21h13V9.5" /><path d="M9.5 21v-6h5v6" /></svg>
        </span>
        <span class="nav-label">首页</span>
      </a>
      <a href="goals.html" data-nav="goals">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="4.2" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2" /></svg>
        </span>
        <span class="nav-label">目标</span>
      </a>
      <a href="city.html" data-nav="achievements">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z" /><path d="M5 6H3a2 2 0 0 0 2 3m14-3h2a2 2 0 0 1-2 3" /><path d="M12 13v4M9 21h6" /></svg>
        </span>
        <span class="nav-label">成就</span>
      </a>
      <a href="stats.html" data-nav="stats" aria-current="page">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16" /><rect x="6" y="11" width="3" height="7" rx="1" /><rect x="11" y="7" width="3" height="11" rx="1" /><rect x="16" y="4" width="3" height="14" rx="1" /></svg>
        </span>
        <span class="nav-label">统计</span>
      </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/app-data.js"></script>
    <script src="../js/weekly-report-data.js"></script>
    <script src="../js/secrets.local.js"></script>
    <script src="../js/rolling-plan.js"></script>
    <script src="../js/weekly-report-ai.js"></script>
    <script src="../js/weekly-report-modal.js"></script>
    <script src="../js/app-shared.js"></script>
    <script src="../js/goal-ui.js"></script>
    <script src="../js/achievements.js"></script>
    <script src="../js/background.js"></script>
    <script src="../js/stats.js"></script>
  </body>
</html>
