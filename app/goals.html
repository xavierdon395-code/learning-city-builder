<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习城市建设者 — 目标</title>
    <style>
      html,
      body {
        background: #050507;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/dev-panel.css" />
  
    <link rel="prefetch" href="index.html" />
    <link rel="prefetch" href="goals.html" />
    <link rel="prefetch" href="city.html" />
    <link rel="prefetch" href="stats.html" />
  </head>
  <body class="app-body--nav-56">
    <canvas id="cosmos-bg" class="cosmos-bg" aria-hidden="true"></canvas>
    <header class="app-top-bar">
      <div class="app-top-bar__left">
        <div class="app-top-bar__logo">
          <div class="app-top-bar__logo-dot"></div>
        </div>
        <span class="app-top-bar__brand">Lumi</span>
      </div>
      <div class="app-top-bar__right">
        <div class="app-top-bar__moon-pill">
          <div class="app-top-bar__moon-dot"></div>
          <span id="topbar-zodiac">金牛月</span>
        </div>
        <div class="app-top-bar__avatar" id="topbar-avatar" onclick="logout()" title="点击退出">
          <span id="topbar-avatar-initial">U</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="card">
        <div class="section-head">
          <h1 class="card__title" style="margin: 0">全部目标</h1>
          <button type="button" class="btn btn--secondary" id="btn-new-goal-top">＋ 新建目标</button>
        </div>
        <div id="goals-empty" class="empty-state" hidden>
          <div class="empty-pixel" aria-hidden="true"></div>
          <p>还没有目标，点击创建第一个目标</p>
        </div>
        <div id="goals-list" class="goal-grid" hidden></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html" data-nav="home">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5.5 9.5V21h13V9.5" /><path d="M9.5 21v-6h5v6" /></svg>
        </span>
        <span class="nav-label">首页</span>
      </a>
      <a href="goals.html" data-nav="goals" aria-current="page">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="4.2" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2" /></svg>
        </span>
        <span class="nav-label">目标</span>
      </a>
      <a href="city.html" data-nav="achievements">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z" /><path d="M5 6H3a2 2 0 0 0 2 3m14-3h2a2 2 0 0 1-2 3" /><path d="M12 13v4M9 21h6" /></svg>
        </span>
        <span class="nav-label">成就</span>
      </a>
      <a href="stats.html" data-nav="stats">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16" /><rect x="6" y="11" width="3" height="7" rx="1" /><rect x="11" y="7" width="3" height="11" rx="1" /><rect x="16" y="4" width="3" height="14" rx="1" /></svg>
        </span>
        <span class="nav-label">统计</span>
      </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/app-data.js"></script>
    <script src="../js/app-shared.js"></script>
    <script src="../js/goal-ui.js"></script>
    <script src="../js/secrets.local.js"></script>
    <script src="../js/rolling-plan.js"></script>
    <script src="../js/achievements.js"></script>
    <script src="../js/background.js"></script>
    <script src="../js/cosmos-dialog.js"></script>
    <script src="../js/goals-page.js"></script>
  </body>
</html>
