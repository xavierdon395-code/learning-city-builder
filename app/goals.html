<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习城市建设者 — 目标</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/dev-panel.css" />
  </head>
  <body>
    <canvas id="cosmos-bg" class="cosmos-bg" aria-hidden="true"></canvas>
    <header class="top-nav">
      <a class="top-nav__brand" href="index.html">
        <span class="logo-pixel" aria-hidden="true"></span>
        <span class="nav-zodiac" data-zodiac-slot></span>
        <span class="pixel-title brand-title">学习城市建设者</span>
      </a>
      <div class="top-nav__user">
        <div class="avatar-pixel" id="nav-user-initial">学</div>
        <div class="nav-user-meta">
          <span class="nav-user-name" id="nav-user-name">学习者</span>
        </div>
        <button type="button" class="btn-nav-out btn btn--danger btn--small" id="nav-logout">退出</button>
      </div>
    </header>

    <main class="app-main">
      <section class="card">
        <div class="section-head">
          <h1 class="card__title" style="margin: 0">全部目标</h1>
          <button type="button" class="btn btn--secondary" id="btn-new-goal-top">＋ 新建目标</button>
        </div>
        <div id="goals-empty" class="empty-state" hidden>
          <div class="empty-pixel" aria-hidden="true"></div>
          <p>还没有目标，点击创建第一个目标</p>
        </div>
        <div id="goals-list" class="goal-grid" hidden></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html" data-nav="home"><span class="emoji">🏠</span>首页</a>
      <a href="goals.html" data-nav="goals"><span class="emoji">🎯</span>目标</a>
      <a href="city.html" data-nav="achievements"><span class="emoji">🏆</span>成就</a>
      <a href="stats.html" data-nav="stats"><span class="emoji">📊</span>统计</a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/app-data.js"></script>
    <script src="../js/app-shared.js"></script>
    <script src="../js/goal-ui.js"></script>
    <script src="../js/secrets.local.js"></script>
    <script src="../js/rolling-plan.js"></script>
    <script src="../js/achievements.js"></script>
    <script src="../js/background.js"></script>
    <script src="../js/cosmos-dialog.js"></script>
    <script src="../js/goals-page.js"></script>
    <script src="../js/dev-panel.js"></script>
  </body>
</html>
