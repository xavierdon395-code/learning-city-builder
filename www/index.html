<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习城市建设者 — 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/dev-panel.css" />
  </head>
  <body class="login-page">
    <canvas id="cosmos-bg" class="cosmos-bg" aria-hidden="true"></canvas>

    <div class="login-wrap">
      <main class="login-panel" aria-labelledby="login-title">
        <header class="login-brand">
          <h1 id="login-title">欢迎回来</h1>
          <p class="login-sub">登录继续你的学习旅程</p>
        </header>

        <div class="login-tabs" role="tablist">
          <button type="button" id="tab-phone" role="tab" aria-selected="false" aria-controls="section-phone" style="display:none">手机号</button>
          <button type="button" id="tab-email" role="tab" aria-selected="true" aria-controls="section-email">邮箱</button>
        </div>

        <section class="auth-section" id="section-phone" role="tabpanel" aria-labelledby="tab-phone" style="display:none">
          <div class="field">
            <label for="phone-input">手机号（中国大陆）</label>
            <input
              id="phone-input"
              type="tel"
              inputmode="numeric"
              autocomplete="tel-national"
              placeholder="11 位手机号"
              maxlength="11"
            />
          </div>
          <div class="row">
            <div class="field" style="flex: 2">
              <label for="sms-code">短信验证码</label>
              <input id="sms-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" />
            </div>
            <div class="field" style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end">
              <label class="visually-hidden" for="send-code">发送验证码</label>
              <button type="button" class="btn btn--secondary" id="send-code" style="margin-top: 1.45rem">获取验证码</button>
            </div>
          </div>
          <div id="recaptcha-container"></div>
          <button type="button" class="btn btn--primary btn-block" id="phone-login">验证并登录</button>
        </section>

        <section class="auth-section is-active" id="section-email" role="tabpanel" aria-labelledby="tab-email">
          <div class="field">
            <label for="email-input">邮箱</label>
            <input id="email-input" type="email" autocomplete="username" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="password-input">密码</label>
            <input id="password-input" type="password" autocomplete="current-password" placeholder="至少 6 位" />
          </div>
          <div class="field" id="field-confirm" hidden>
            <label for="password-confirm">确认密码</label>
            <input id="password-confirm" type="password" autocomplete="new-password" />
          </div>
          <button type="button" class="btn btn--primary btn-block" id="email-submit">登录</button>
          <div class="login-separator" id="apple-login-wrap">
            <span>或</span>
          </div>
          <button type="button" class="btn btn--apple btn-block" id="apple-login">
            <span class="btn--apple__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path
                  d="M16.37 12.33c.02 2.4 2.1 3.2 2.13 3.22-.02.05-.33 1.15-1.08 2.28-.65.98-1.33 1.95-2.4 1.97-1.05.02-1.39-.62-2.59-.62-1.21 0-1.58.6-2.57.64-1 .04-1.77-1.04-2.42-2.02-1.33-1.95-2.33-5.53-.97-7.88.68-1.17 1.9-1.9 3.23-1.92 1.02-.02 1.97.68 2.58.68.61 0 1.74-.84 2.93-.72.5.02 1.92.2 2.82 1.52-.07.04-1.68.98-1.66 2.85Zm-2.08-5.67c.54-.66.9-1.58.8-2.5-.78.03-1.72.52-2.28 1.18-.5.58-.94 1.51-.82 2.4.88.07 1.77-.45 2.3-1.08Z"
                ></path>
              </svg>
            </span>
            <span id="apple-login-label">Sign in with Apple</span>
          </button>
          <div class="toggle-email-mode">
            <button type="button" id="email-mode-toggle">没有账号？注册</button>
          </div>
        </section>

        <div id="auth-message" class="msg" aria-live="polite"></div>
        <p class="login-legal">
          登录即表示同意
          <button type="button" class="login-legal__link">服务条款</button>
          与
          <button type="button" class="login-legal__link">隐私政策</button>
        </p>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app-data.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/background.js"></script>
    <script src="js/login.js"></script>
    <script>
      document.body.classList.add("page-enter");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.body.classList.add("page-enter-active");
        });
      });
    </script>
  </body>
</html>
