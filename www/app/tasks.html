<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习城市建设者 — 今日任务</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/dev-panel.css" />
  </head>
  <body>
    <canvas id="cosmos-bg" class="cosmos-bg" aria-hidden="true"></canvas>
    <header class="top-nav">
      <a class="top-nav__brand" href="index.html">
        <span class="logo-pixel" aria-hidden="true"></span>
        <span class="nav-zodiac" data-zodiac-slot></span>
        <span class="pixel-title brand-title">学习城市建设者</span>
      </a>
      <div class="top-nav__user">
        <div class="avatar-pixel" id="nav-user-initial">学</div>
        <div class="nav-user-meta">
          <span class="nav-user-name" id="nav-user-name">学习者</span>
        </div>
        <button type="button" class="btn-nav-out btn btn--danger btn--small" id="nav-logout">退出</button>
      </div>
    </header>

    <canvas id="task-fx-canvas" class="task-fx-canvas" aria-hidden="true"></canvas>

    <main class="app-main">
      <section class="card card--streak">
        <div class="tasks-streak-row">
          <span class="tasks-streak-flame" aria-hidden="true">✦</span>
          <div>
            <div class="card__title" style="font-size: 0.75rem; margin-bottom: 4px">今日连续打卡</div>
            <p class="tasks-streak-num" id="tasks-streak-num">0 天</p>
          </div>
        </div>
        <div class="tasks-leave-row" style="margin-top: 12px">
          <p class="muted" id="tasks-leave-hint" hidden></p>
          <button type="button" class="btn btn--secondary" id="btn-today-leave">今日请假</button>
        </div>
      </section>

      <section class="card">
        <h1 class="card__title">今日学习</h1>
        <p class="muted" id="tasks-date">—</p>
        <p class="muted" id="tasks-summary">今日共 0 个任务</p>
        <p class="muted" id="tasks-prefetch-hint" hidden aria-live="polite" style="margin-top: 8px; font-size: 0.8rem"></p>
      </section>

      <section class="card">
        <div id="task-list" class="task-list"></div>
        <p class="muted" id="tasks-empty" hidden>今天还没有任务，去创建一个目标吧。</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html" data-nav="home"><span class="emoji">🏠</span>首页</a>
      <a href="goals.html" data-nav="goals"><span class="emoji">🎯</span>目标</a>
      <a href="city.html" data-nav="achievements"><span class="emoji">🏆</span>成就</a>
      <a href="stats.html" data-nav="stats"><span class="emoji">📊</span>统计</a>
    </nav>

    <div class="celebrate-overlay" id="celebrate" aria-hidden="true">
      <div class="celebrate-box">
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <p class="card__title" style="margin-bottom: 12px">今日任务全部完成！</p>
        <p class="muted">太棒了！去看看新解锁的成就徽章吧！</p>
        <button type="button" class="btn btn--primary btn-block" id="celebrate-close" style="margin-top: 14px" data-no-sound>
          前往成就墙
        </button>
      </div>
    </div>

    <div class="ach-celebrate" id="ach-celebrate-tasks" aria-hidden="true">
      <div class="ach-celebrate__stars"></div>
      <div class="ach-celebrate__box">
        <div class="ach-celebrate__icon">🏆</div>
        <p class="ach-celebrate__title pixel-title">新徽章</p>
        <p class="ach-celebrate__sub"></p>
      </div>
    </div>

    <div class="phase-modal" id="phase-modal" aria-hidden="true" hidden>
      <div class="phase-modal__backdrop" id="phase-modal-close-bg"></div>
      <div class="phase-modal-content">
        <div class="phase-celebration" id="phase-modal-celebration">✨ 阶段完成 ✨</div>
        <h2 id="phase-modal-title">阶段已圆满</h2>
        <div class="phase-stats">
          <div id="phase-modal-rate">本阶段完成率：0%</div>
          <div id="phase-modal-days">累计天数：0 / 0</div>
        </div>
        <p class="phase-next" id="phase-modal-next">接下来将进入下一阶段</p>
        <div class="phase-actions">
          <button type="button" class="btn btn--primary btn-block" id="phase-modal-auto">✨ AI根据完成情况自动生成</button>
          <button type="button" class="btn btn--secondary btn-block" id="phase-modal-custom">✏️ 我想手动调整方向</button>
          <button type="button" class="btn btn--ghost btn-block" id="phase-modal-later">稍后再说</button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/app-data.js"></script>
    <script src="../js/app-shared.js"></script>
    <script src="../js/task-fx.js"></script>
    <script src="../js/achievements.js"></script>
    <script src="../js/background.js"></script>
    <script src="../js/cosmos-dialog.js"></script>
    <script src="../js/secrets.local.js"></script>
    <script src="../js/rolling-plan.js"></script>
    <script src="../js/tasks.js"></script>
    <script src="../js/dev-panel.js"></script>
  </body>
</html>
